<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graden &amp; Annyka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="slides">
    <div class="slide"><img class="photo" alt=""></div>
    <div class="slide"><img class="photo" alt=""></div>
  </div>
  <div class="scrim top"></div>
  <div class="scrim bottom"></div>

  <header id="hud">
    <div>
      <div id="greeting">Good morning</div>
      <div class="names">Graden &amp; Annyka</div>
    </div>
    <div id="clock">
      <div id="time">--:--</div>
      <div id="date"></div>
    </div>
  </header>

  <!-- App row. data-app matches an entry in APPS in app.js. -->
  <nav id="dock">
    <div class="tile netflix" data-app="netflix"><span class="mark">NETFLIX</span><span class="label">Netflix</span></div>
    <div class="tile prime" data-app="prime"><span class="mark">prime video</span><span class="label">Prime Video</span></div>
    <div class="tile disney" data-app="disney"><span class="mark">Disney+</span><span class="label">Disney+</span></div>
    <div class="tile youtube" data-app="youtube"><span class="mark"><b class="yt-play"></b>YouTube</span><span class="label">YouTube</span></div>
    <div class="tile music" data-app="music"><img class="cover" alt=""><span class="label">Annyka's Album</span></div>
    <div class="tile icon" data-app="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.65.07.97l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65a7.7 7.7 0 0 0 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></svg>
      <span class="label">Settings</span>
    </div>
    <div class="tile icon" data-app="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.6 12 3l9 7.6V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.4Z"/></svg>
      <span class="label">Samsung Home</span>
    </div>
  </nav>

  <!-- Now playing. The Suno player inside does the actual playback. -->
  <section id="now-playing" hidden>
    <div class="np-main">
      <img id="np-cover" alt="">
      <div class="np-info">
        <div class="np-label"><span class="eq"><i></i><i></i><i></i></span>Now playing</div>
        <div id="np-title"></div>
        <div class="np-album">Annyka &middot; Suno</div>
        <div class="np-progress">
          <span id="np-elapsed">0:00</span>
          <div class="bar"><div id="np-bar"></div></div>
          <span id="np-total">0:00</span>
        </div>
      </div>
    </div>
    <div class="np-foot">
      <span>Streaming from Suno</span>
      <div id="suno-player"></div>
    </div>
  </section>

  <!-- Album picker, opened from the music tile. -->
  <section id="picker" hidden>
    <div class="picker-side">
      <img id="album-cover" alt="">
      <p class="eyebrow">Album</p>
      <h2 id="album-name">Annyka</h2>
      <p id="album-meta"></p>
      <div class="picker-actions">
        <button class="pill" type="button" data-action="shuffle">Shuffle all</button>
        <button class="pill" type="button" data-action="stop">Stop music</button>
      </div>
      <p class="hint">Back to close</p>
    </div>
    <ol id="song-list"></ol>
  </section>

  <div id="toast" hidden></div>

  <script src="songs.js"></script>
  <script src="photos.js"></script>
  <script src="app.js"></script>
</body>
</html>
