name: Refresh songs and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *" # daily, ~4 AM Mountain
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh song list from Suno
        # If Suno is down, keep yesterday's list and still deploy.
        continue-on-error: true
        run: node scripts/update-songs.mjs

      - name: Rebuild photo list
        run: node scripts/build-photos.mjs

      - name: Commit updated lists
        run: |
          if git diff --quiet -- songs.js photos.js; then
            echo "Nothing changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add songs.js photos.js
            git commit -m "Update song and photo lists"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css app.js songs.js photos.js photos _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
